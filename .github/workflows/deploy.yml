name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_mysql
          coverage: none
      
      # Composer validation skipped - backend app is deployed via git on server
      # - name: 📦 Install Composer Dependencies
      #   working-directory: ./backend
      #   run: |
      #     composer validate --strict
      #     composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-dev
      
      # - name: 🧪 Run Tests (Optional - comment out to skip)
      #   working-directory: ./backend
      #   run: |
      #     cp .env.example .env
      #     php artisan key:generate
      #     # php artisan test --parallel
      #     echo "✅ Tests skipped - remove this line and uncomment above to run tests"
      
      - name: 📊 Deployment Info
        run: |
          echo "=========================================="
          echo "📦 Deploying Commit:"
          echo "Branch: ${GITHUB_REF#refs/heads/}"
          echo "Commit: ${GITHUB_SHA:0:7}"
          echo "Author: ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo "=========================================="
      
      - name: 🚀 Deploy to Production
        uses: appleboy/ssh-action@v1.0.0
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: COMMIT_SHA,COMMIT_MESSAGE,GITHUB_ACTOR
          script: |
            echo "🚀 Starting deployment..."
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            git fetch origin master
            git reset --hard origin/master
            chmod +x deploy.sh
            bash deploy.sh
      
      - name: ✅ Deployment Complete
        if: success()
        run: |
          echo "=========================================="
          echo "✅ Deployment successful!"
          echo "🌐 URL: ${{ secrets.PROD_URL }}"
          echo "⏰ Time: $(date)"
          echo "=========================================="
      
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ Deployment failed!"
          echo "Check logs above for errors"
          echo "=========================================="
          exit 1

