version: '3.8'

services:
  # OPF-CD Web Application
  opfcd-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opfcd_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # Only mount specific directories that need to persist
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_NAME=OPF-CD
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://opfcd.3bs.ltd
      - DB_HOST=opfcd-database
      - DB_PORT=3306
      - DB_DATABASE=opfcd
      - DB_USERNAME=opfcd_user
      - DB_PASSWORD=${DB_PASSWORD:-opfcd_secure_password_2026}
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=opfcd-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-opfcd_redis_2026}
      - REDIS_PORT=6379
    depends_on:
      - opfcd-database
      - opfcd-redis
    networks:
      - opfcd-network
    ports:
      - "8090:9000"  # PHP-FPM port (internal)

  # Database Service
  opfcd-database:
    image: mysql:8.0
    container_name: opfcd_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: opfcd
      MYSQL_USER: opfcd_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-opfcd_secure_password_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-opfcd_root_password_2026}
    volumes:
      - opfcd_mysql_data:/var/lib/mysql
      - ./database/backups:/backups
    networks:
      - opfcd-network
    ports:
      - "3307:3306"  # External access on different port
    command: --default-authentication-plugin=mysql_native_password

  # Redis for Caching & Sessions
  opfcd-redis:
    image: redis:7-alpine
    container_name: opfcd_redis
    restart: unless-stopped
    volumes:
      - opfcd_redis_data:/data
    networks:
      - opfcd-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-opfcd_redis_2026}

  # Nginx Web Server
  opfcd-nginx:
    image: nginx:alpine
    container_name: opfcd_nginx
    restart: unless-stopped
    ports:
      - "8091:80"    # HTTP
      - "8092:443"   # HTTPS
    volumes:
      # Only mount the public directory for serving static files
      - ./backend_old_manual_deployment/public:/var/www/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites/:/etc/nginx/sites-available/:ro
      - ./docker/nginx/ssl/:/etc/nginx/ssl/:ro
      - ./storage/logs/nginx/:/var/log/nginx/
    depends_on:
      - opfcd-app
    networks:
      - opfcd-network

  # Queue Worker
  opfcd-queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opfcd_queue
    restart: unless-stopped
    working_dir: /var/www
    # Remove volume mount - use files from container build with vendor directory
    environment:
      - APP_ENV=production
      - DB_HOST=opfcd-database
      - DB_DATABASE=opfcd
      - DB_USERNAME=opfcd_user
      - DB_PASSWORD=${DB_PASSWORD:-opfcd_secure_password_2026}
      - REDIS_HOST=opfcd-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-opfcd_redis_2026}
      - REDIS_PORT=6379
    depends_on:
      - opfcd-database
      - opfcd-redis
    networks:
      - opfcd-network
    command: php artisan queue:work --verbose --tries=3 --timeout=90

  # Scheduler (Laravel Cron)
  opfcd-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opfcd_scheduler
    restart: unless-stopped
    working_dir: /var/www
    # Remove volume mount - use files from container build with vendor directory
    environment:
      - APP_ENV=production
      - DB_HOST=opfcd-database
      - DB_DATABASE=opfcd
      - DB_USERNAME=opfcd_user
      - DB_PASSWORD=${DB_PASSWORD:-opfcd_secure_password_2026}
      - REDIS_HOST=opfcd-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-opfcd_redis_2026}
      - REDIS_PORT=6379
    depends_on:
      - opfcd-database
      - opfcd-redis
    networks:
      - opfcd-network
    command: sh -c 'while true; do php artisan schedule:run && sleep 60; done'

volumes:
  opfcd_mysql_data:
    driver: local
  opfcd_redis_data:
    driver: local

networks:
  opfcd-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24